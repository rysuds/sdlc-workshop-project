<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Listings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Movie Listings</h1>
            <p class="subtitle">Browse our collection of movies</p>
        </header>

        <div class="controls">
            <input 
                type="text" 
                id="search" 
                placeholder="Search movies..." 
                aria-label="Search movies"
            >
            <select id="genre-filter" aria-label="Filter by genre">
                <option value="">All Genres</option>
            </select>
        </div>

        <div class="table-container">
            <table id="movies-table">
                <thead>
                    <tr>
                        <th>Poster</th>
                        <th data-sort="Title">Title</th>
                        <th data-sort="Genre">Genre</th>
                        <th data-sort="Vote_Average">Rating</th>
                        <th data-sort="Release_Date">Release Date</th>
                    </tr>
                </thead>
                <tbody id="movies-body">
                    <!-- Movies will be loaded here -->
                </tbody>
            </table>
        </div>

        <div class="loading" id="loading">Loading movies...</div>
        <div class="error" id="error" style="display: none;"></div>

        <footer>
            <p>SDLC Workshop Project</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
